# Nginx reverse-proxy for CourseVault.
# Place at /etc/nginx/sites-available/coursevault and symlink into
# sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
#
# Replace yourdomain.com everywhere. TLS certificates via certbot:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
# ── The upstream ─────────────────────────────────────────────────────────
# scripts/deploy.sh runs two slots (blue :3001 / green :3002) and flips
# between them with a graceful reload, so the app's address is NOT written
# here — it lives in /etc/nginx/conf.d/coursevault-upstream.conf, which the
# deploy script rewrites. Create it once before the first deploy:
#
#   upstream coursevault_app {
#       server 127.0.0.1:3001;   # slot: blue
#       keepalive 32;
#   }
#
# A single-slot setup can define the same block pointing at its only port.

# Rate-limit zone for the whole site (burst-friendly; the app enforces
# stricter per-endpoint limits itself).
limit_req_zone $binary_remote_addr zone=coursevault:10m rate=20r/s;

# ── Trusting the client IP ───────────────────────────────────────────────
# The app resolves the visitor's address from CF-Connecting-IP, then
# Forwarded, then X-Forwarded-For, then X-Real-IP (src/lib/ip.ts), and keys
# every rate limit on the result. It cannot see the TCP peer, so it has to
# take one of those headers at face value — which is only safe if nothing but
# a trusted proxy can set them.
#
# BEHIND CLOUDFLARE, THIS IS NOT AUTOMATIC. Anyone who learns the origin's
# address can connect to it directly and send whatever CF-Connecting-IP they
# like; a fresh value per request then defeats every IP-keyed limit in the
# app (download-init, /go, the verification challenge, the social downloader).
# Two things close that, and both are needed:
#
#   1. Firewall 80/443 to Cloudflare's published ranges, so a direct
#      connection never arrives:
#        https://www.cloudflare.com/ips/
#      (ufw allow from <range> to any port 443 proto tcp, for each range.)
#      This is the load-bearing half. Measured against the running app: 40
#      requests carrying one forged CF-Connecting-IP hit the limit and were
#      refused; 40 requests each carrying a different forged value all
#      succeeded. Nothing in the application can tell those apart.
#      scripts/check-cloudflare-allowlist.sh verifies the rules still match
#      Cloudflare's published list — worth running after any firewall change,
#      because the ranges do move.
#
#   2. Let nginx — not the app — decide the client address, and overwrite the
#      headers on the way through, so a forged one can never survive. The
#      real_ip block below does exactly that: $remote_addr becomes the value
#      Cloudflare vouched for, and only when the connection itself came from
#      Cloudflare.
#
# Uncomment and keep the list current (or generate it from the URL above).
# Without Cloudflare, delete the real_ip block entirely: $remote_addr is then
# already the client and the proxy_set_header lines below stay correct.
#
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
# set_real_ip_from 2400:cb00::/32;
# set_real_ip_from 2606:4700::/32;
# set_real_ip_from 2803:f800::/32;
# set_real_ip_from 2405:b500::/32;
# set_real_ip_from 2405:8100::/32;
# set_real_ip_from 2a06:98c0::/29;
# set_real_ip_from 2c0f:f248::/32;
# real_ip_header CF-Connecting-IP;
# real_ip_recursive on;

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    # Certbot will add the HTTPS redirect here automatically; until then:
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # --- TLS (paths filled by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- Hardening ---
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    client_max_body_size 10m;

    # --- Compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
    # Correctness behind any cache/CDN: vary on Accept-Encoding, and don't skip
    # compression just because the request already passed through a proxy.
    gzip_vary on;
    gzip_proxied any;

    limit_req zone=coursevault burst=40 nodelay;

    # Serve uploaded images directly from disk (bypasses Node).
    # Path must match UPLOAD_DIR. Comment this block out to let the app serve
    # uploads instead (src/app/uploads/[file]/route.ts, which additionally
    # restricts the extension).
    location /uploads/ {
        alias /var/lib/coursevault/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Everything in this directory is written by the app's own image
        # pipeline, which re-encodes to WebP — but nginx guesses a type from
        # the extension, and content sniffing on a guess is how a stored file
        # gets interpreted as something it is not. The app's own upload route
        # already sends this; serving the same bytes from disk should not be
        # weaker than serving them through Node.
        add_header X-Content-Type-Options "nosniff";
        try_files $uri @app;
    }

    # Long-cache Next.js static assets.
    location /_next/static/ {
        proxy_pass http://coursevault_app;
        proxy_http_version 1.1;
        # Empty, not "upgrade": this is a plain proxied request, and sending an
        # Upgrade token on it defeats upstream keepalive for every asset.
        proxy_set_header Connection "";
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files /nonexistent @app;
    }

    location @app {
        proxy_pass http://coursevault_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Overwrite, never append. Each of these is a header the app trusts, so
        # every one of them must be replaced with a value nginx derived rather
        # than passed through from the client. `Forwarded` is set empty because
        # nothing here emits it and the app would otherwise read a forged one
        # in preference to X-Forwarded-For.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 60s;
    }
}
