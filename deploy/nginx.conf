# Nginx reverse-proxy for CourseVault.
# Place at /etc/nginx/sites-available/coursevault and symlink into
# sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
#
# Replace yourdomain.com everywhere. TLS certificates via certbot:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com

# Rate-limit zone for the whole site (burst-friendly; the app enforces
# stricter per-endpoint limits itself).
limit_req_zone $binary_remote_addr zone=coursevault:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    # Certbot will add the HTTPS redirect here automatically; until then:
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # --- TLS (paths filled by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- Hardening ---
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    client_max_body_size 10m;

    # --- Compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    limit_req zone=coursevault burst=40 nodelay;

    # Serve uploaded images directly from disk (bypasses Node).
    # Path must match UPLOAD_DIR (docker volume mounted on the host or a
    # bind mount). Comment this block out to let the app serve uploads.
    location /uploads/ {
        alias /var/lib/coursevault/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @app;
    }

    # Long-cache Next.js static assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files /nonexistent @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so the app can trust the client IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
